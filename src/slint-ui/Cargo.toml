[package]
name = "plasma-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
build = "build.rs"

[dependencies]
plasma-api = { path = "../api" }
slint = "=1.14.1"

[build-dependencies]
slint-build = "=1.14.1"

# Keep assertions and debug symbols, but do not run the renderer/DSP unoptimized.
# Incremental application builds remain available in the development profile.
[profile.dev]
opt-level = 1
