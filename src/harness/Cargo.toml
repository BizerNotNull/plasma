[package]
name = "plasma-render"
version = "0.1.0"
edition = "2024"
description = "Deterministic offline rendering for the Plasma synthesis kernel"
license = "Apache-2.0"

[[bin]]
name = "plasma-render"
path = "main.rs"

[dependencies]
plasma-kernel = { path = "../kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
